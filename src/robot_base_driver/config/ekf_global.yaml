frequency: 30
sensor_timeout: 0.2
two_d_mode: true
publish_tf: false
transform_time_offset: 0.0
map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map

# 1) 本地融合里程计：仅提供朝向增量，避免把全局位置锁在局部原点
odom0: /odometry/local
odom0_config: [false, false, false,
               false, false, true,
               false, false, false,
               false, false, true,
               false, false, false]
odom0_differential: true
odom0_queue_size: 10

# 2) GPS转换里程计：提供全局绝对平面位置
odom1: /odometry/gps
odom1_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_differential: false
odom1_queue_size: 10
odom1_pose_rejection_threshold: 1000000.0
odom1_twist_rejection_threshold: 1000000.0
