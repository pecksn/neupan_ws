frequency: 30
sensor_timeout: 0.2
two_d_mode: true
publish_tf: false
transform_time_offset: 0.0
map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map

# 1) 轮式里程计（增量）
odom0: /odom
odom0_config: [true,  true,  false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom0_differential: true
odom0_queue_size: 10

# 2) LIO里程计（增量使用，避免与GPS绝对位置冲突）
odom1: /Odometry
odom1_config: [true,  true,  false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_differential: true
odom1_queue_size: 10

# 3) GPS转换里程计（绝对位置约束）
odom2: /odometry/gps
odom2_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
odom2_differential: false
odom2_queue_size: 10
odom2_pose_rejection_threshold: 4.0
odom2_twist_rejection_threshold: 2.0
