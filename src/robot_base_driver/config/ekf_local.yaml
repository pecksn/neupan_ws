frequency: 50
sensor_timeout: 0.1
two_d_mode: true
publish_tf: true
transform_time_offset: 0.05
map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

# 1. 轮式里程计 (下位机发来的，高频平滑但是有长距离累计漂移)
odom0: /odom
odom0_config: [true,  true,  false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom0_differential: true
odom0_queue_size: 10

# 2. 激光里程计 (经过跳变保护的 FAST-LIO 输出)
odom1: /odometry/lio_guarded
odom1_config: [true,  true,  false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_differential: false
odom1_queue_size: 5
odom1_pose_rejection_threshold: 3.0
