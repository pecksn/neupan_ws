TebLocalPlannerROS:
  odom_topic: /odometry/local # TEB 使用的里程计来源，提供当前位置/姿态/速度。
  map_frame: map # 局部规划参考的全局坐标系。

  teb_autosize: true # 自动调整轨迹离散点数量。
  dt_ref: 0.25 # 相邻轨迹点的目标时间间隔；越小轨迹越细，但更敏感。
  dt_hysteresis: 0.1 # 对 dt_ref 的容忍带，避免轨迹点数频繁变化。
  global_plan_overwrite_orientation: true # 用全局路径方向覆盖局部方向参考。
  max_global_plan_lookahead_dist: 8.0 # 局部规划最多向前看多远的全局路径。
  feasibility_check_no_poses: 5 # 检查前几个轨迹点是否碰撞可行；越大越保守。

  max_vel_x: 0.8 # 最大前进速度。
  max_vel_x_backwards: 0.45 # 最大倒车速度；越大越容易靠倒车脱困。
  max_vel_theta: 0.8 # 最大角速度约束。
  acc_lim_x: 1.3 # 纵向最大加速度；越大恢复速度越快。
  acc_lim_theta: 0.8 # 转向变化速度约束。

  min_turning_radius: 1.85 # 阿克曼车最小转弯半径。
  wheelbase: 0.67 # 轴距，决定阿克曼几何约束。
  cmd_angle_instead_rotvel: true # 输出前轮转角，而不是差速式角速度。

  footprint_model:
    type: "polygon" # 使用多边形车体模型做碰撞检测。
    vertices: [[0.475, 0.30], [0.475, -0.30], [-0.475, -0.30], [-0.475, 0.30]] # 车体四角点，决定真实包络。

  xy_goal_tolerance: 1.2 # 到目标点的位置容差；大一点更不容易死磕最后一点。
  yaw_goal_tolerance: 0.4 # 到目标朝向的容差。
  free_goal_vel: false # 到终点不允许带速度穿过去。
  complete_global_plan: true # 倾向跟完整全局路径，而不是只跟局部一小段。

  min_obstacle_dist: 0.12 # 轨迹离障碍的最小安全距离；越大越容易停。
  inflation_dist: 0.22 # 障碍外围开始增加代价的距离；越大越保守。
  include_costmap_obstacles: true # 将 costmap 中的障碍物纳入优化。
  costmap_obstacles_behind_robot_dist: 0.2 # 车后多远范围内的障碍也参与约束。
  obstacle_poses_affected: 6 # 单个障碍点会影响多少个轨迹位姿；越大越容易拖住整条轨迹。

  weight_max_vel_x: 2.0 # 惩罚超过最大前进速度。
  weight_max_vel_theta: 1.0 # 惩罚超过最大角速度。
  weight_acc_lim_x: 0.2 # 惩罚纵向加速度过大；小一点更利于快速恢复。
  weight_acc_lim_theta: 1.0 # 惩罚转向变化过猛。
  weight_kinematics_nh: 1000.0 # 强约束阿克曼非完整运动学。
  weight_kinematics_forward_drive: 8.0 # 惩罚倒车；越大越不愿倒车。
  weight_kinematics_turning_radius: 50.0 # 惩罚违反最小转弯半径。
  weight_obstacle: 6.0 # 障碍主惩罚权重；越大越容易见障就保守。
  weight_inflation: 0.02 # 障碍膨胀区惩罚；越大越不敢贴边走。
  weight_optimaltime: 5.0 # 倾向更快通过，别磨蹭。
  weight_shortest_path: 0.3 # 倾向更短路径。

  enable_homotopy_class_planning: true # 搜索多条不同绕障拓扑的候选轨迹。
  enable_multithreading: true # 多线程搜索候选轨迹。
  max_number_classes: 4 # 最多比较几类不同绕行方案。
  selection_cost_hysteresis: 1.0 # 轨迹切换迟滞，避免左右来回换方案。
  selection_prefer_initial_plan: 0.4 # 对初始轨迹的偏好；小一点更愿意主动绕开。
  roadmap_graph_no_samples: 20 # 同伦图采样数量。
  roadmap_graph_area_width: 6.5 # 候选绕行搜索的横向宽度；越大越容易找到绕行。
  h_signature_prescaler: 0.5 # 同伦签名缩放参数。
  h_signature_threshold: 0.1 # 判断两条路径是否属于不同同伦类的阈值。

  visualize_hc_graph: false # 不显示同伦类搜索图。
  publish_feedback: true # 发布 TEB 调试反馈，便于观察内部轨迹。
