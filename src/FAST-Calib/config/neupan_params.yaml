# Neupan MID360 + 180-degree rotated USB-camera calibration.
# Camera intrinsics come from src/usb_camera/config/usb_camera.yaml.
fx: 1056.5434295756897
fy: 1057.3350109603232
cx: 887.6099684823234
cy: 687.9125738476482
k1: -0.40130317211542343
k2: 0.1845567579908426
p1: 0.00034687862877420003
p2: 0.0014981691723600034

# FAST-Calib standard target dimensions (metres).
marker_size: 0.20
delta_width_qr_center: 0.55
delta_height_qr_center: 0.35
delta_width_circles: 0.50
delta_height_circles: 0.40
circle_radius: 0.12
min_detected_markers: 4

# MID360 sampling at about 2.2 m is sparser than the repository defaults.
solid_normal_radius: 0.06
solid_boundary_radius: 0.06
solid_cluster_tolerance: 0.06
solid_cluster_min_size: 20
solid_cluster_max_size: 2000

lidar_topic: "/livox/lidar"
output_path: "/home/nuc/lxw/neupan_ws/calibration_data/fast_calib_output"

# Defaults can be overridden from neupan_calib.launch.
x_min: 1.5
x_max: 2.8
y_min: -1.5
y_max: 1.5
z_min: 0.1
z_max: 1.8
