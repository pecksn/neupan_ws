# NUC15 has separate radar/GPU links in 192.168.1.0/24.
# Answer ARP only on the interface which owns the requested address.
# Peer-specific /32 routes are persisted in NetworkManager profiles.
net.ipv4.ip_forward = 1
net.ipv4.conf.enp86s0.arp_ignore = 1
net.ipv4.conf.enp86s0.arp_announce = 2
net.ipv4.conf.enxec1ac30270b6.arp_ignore = 1
net.ipv4.conf.enxec1ac30270b6.arp_announce = 2
