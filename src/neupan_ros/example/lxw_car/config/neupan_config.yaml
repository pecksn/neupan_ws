# mpc
receding: 10
step_time: 0.2
ref_speed: 0.3
device: 'cpu' # 作者确认只能用 CPU
time_print: False
collision_threshold: 0.01 #0.01

# robot
robot:
  kinematics: 'acker'   # 保持 'acker' 不变
  wheelbase: 0.67       # 【修改】前后轮轴距 (单位: 米)
  max_speed: [1.0, 1.5] # 【修改】最大线速度(m/s), 最大倒车速度(m/s)
  max_acce: [1.0,1.5]  # 【修改】最大加速度
  length: 0.95          # 将车长缩短到0.85，避免假碰撞，0.95
  width: 0.65           # 将车宽缩短到0.60，避免假碰撞,0.67

# initial path
ipath:
  interval: 0.09
  waypoints: []  #[[0, 0, 0], [5, 0, 0],[10, 0, 0]]
  curve_style: 'reeds'   # 'dubins' or reeds or line
  min_radius: 0.80       # 最小转弯半径 R = L / tan(θ) = 0.67 / tan(40°) ≈ 0.80。设为 0.85 留有余量
  loop: False
  arrive_threshold: 0.5
  close_threshold: 0.15
  arrive_index_threshold: 3 # end of the path 
  
# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint: None
  iter_threshold: 0.1

# adjust parameters
adjust:
  q_s: 1.0     # 【调试】大幅增加状态误差权重 (原 1.0)，更积极地纠正偏离
  p_u: 5.0     # 【调试】大幅增加平滑惩罚 (原 2.5)，抑制左右摆头震荡
  eta: 4.0
  d_max: 1.0   
  d_min: 0.1   
