device: 'cpu'

# robot
robot:
  kinematics: 'acker'   # 保持 'acker' 不变
  wheelbase: 0.67      
  max_speed: [1.0, 0.35]
  max_acce: [0.8, 0.08] 
  length: 0.95          
  width: 0.60           

train:
  direct_train: true
  data_size: 100000
  data_range: [-25, -25, 25, 25]
  batch_size: 256
  epoch: 5000
  valid_freq: 250
  save_freq: 500
  lr: 5e-5
  lr_decay: 0.5
  decay_freq: 1500
