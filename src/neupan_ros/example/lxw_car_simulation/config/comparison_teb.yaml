local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  transform_tolerance: 0.3
  update_frequency: 10.0
  publish_frequency: 2.0
  rolling_window: true
  width: 12.0
  height: 8.0
  resolution: 0.08
  track_unknown_space: false
  footprint: [[-0.14, -0.375], [0.81, -0.375], [0.81, 0.375], [-0.14, 0.375]]
  footprint_padding: 0.0
  plugins:
    - {name: obstacles, type: 'costmap_2d::ObstacleLayer'}
    - {name: inflation, type: 'costmap_2d::InflationLayer'}
  obstacles:
    observation_sources: laser
    laser:
      topic: /scan
      sensor_frame: laser_link
      data_type: LaserScan
      marking: true
      clearing: true
      inf_is_valid: true
      obstacle_range: 12.0
      raytrace_range: 20.0
      observation_persistence: 0.0
      expected_update_rate: 0.3
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
  inflation: {inflation_radius: 0.20, cost_scaling_factor: 10.0}

TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: odom
  teb_autosize: true
  dt_ref: 0.2
  dt_hysteresis: 0.05
  max_samples: 100
  max_global_plan_lookahead_dist: 5.0
  global_plan_overwrite_orientation: true
  global_plan_prune_distance: 2.5
  control_look_ahead_poses: 3
  prevent_look_ahead_poses_near_goal: 2
  exact_arc_length: true
  max_vel_x: 0.5
  max_vel_x_backwards: 0.5
  max_vel_y: 0.0
  max_vel_theta: 0.3
  acc_lim_x: 0.8
  acc_lim_theta: 0.3
  wheelbase: 0.67
  min_turning_radius: 1.85
  cmd_angle_instead_rotvel: true
  allow_init_with_backwards_motion: false
  footprint_model:
    type: polygon
    vertices: [[-0.14, -0.375], [0.81, -0.375], [0.81, 0.375], [-0.14, 0.375]]
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.3
  free_goal_vel: false
  complete_global_plan: true
  min_obstacle_dist: 0.20
  inflation_dist: 0.40
  include_costmap_obstacles: true
  # Cluster scan-derived occupied cells into convex obstacles. Passing every
  # wall pixel separately to homotopy search made an empty road take seconds.
  costmap_converter_plugin: costmap_converter::CostmapToPolygonsDBSMCCH
  costmap_converter_spin_thread: true
  costmap_converter_rate: 10
  include_dynamic_obstacles: false
  # No obstacle ground-truth velocities are supplied to either planner.
  costmap_obstacles_behind_robot_dist: 2.0
  feasibility_check_no_poses: 10
  weight_kinematics_nh: 1000.0
  weight_kinematics_turning_radius: 50.0
  weight_kinematics_forward_drive: 10.0
  weight_obstacle: 50.0
  weight_inflation: 0.1
  weight_optimaltime: 5.0
  enable_homotopy_class_planning: true
  enable_multithreading: false
  max_number_classes: 4
  selection_cost_hysteresis: 1.0
  publish_feedback: true
