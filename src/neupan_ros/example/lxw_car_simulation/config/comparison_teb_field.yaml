# Simulation copy of confirmed real-car TEB settings; source is never modified.
local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  transform_tolerance: 0.3
  update_frequency: 10.0
  publish_frequency: 2.0
  rolling_window: true
  width: 12.0
  height: 8.0
  resolution: 0.08
  track_unknown_space: false
  footprint:
  - - -0.14
    - -0.375
  - - 0.81
    - -0.375
  - - 0.81
    - 0.375
  - - -0.14
    - 0.375
  footprint_padding: 0.0
  plugins:
  - name: obstacles
    type: costmap_2d::ObstacleLayer
  - name: inflation
    type: costmap_2d::InflationLayer
  obstacles:
    observation_sources: laser
    laser:
      topic: /scan
      sensor_frame: laser_link
      data_type: LaserScan
      marking: true
      clearing: true
      inf_is_valid: true
      obstacle_range: 12.0
      raytrace_range: 20.0
      observation_persistence: 0.0
      expected_update_rate: 0.3
      min_obstacle_height: 0.0
      max_obstacle_height: 2.0
  inflation:
    inflation_radius: 0.2
    cost_scaling_factor: 10.0
TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: odom
  teb_autosize: true
  dt_ref: 0.25
  dt_hysteresis: 0.1
  global_plan_overwrite_orientation: true
  max_global_plan_lookahead_dist: 8.0
  feasibility_check_no_poses: 5
  max_vel_x: 0.5
  max_vel_x_backwards: 0.5
  max_vel_theta: 0.8
  acc_lim_x: 1.3
  acc_lim_theta: 0.8
  min_turning_radius: 1.85
  wheelbase: 0.67
  cmd_angle_instead_rotvel: true
  footprint_model:
    type: polygon
    vertices:
    - - -0.14
      - -0.375
    - - 0.81
      - -0.375
    - - 0.81
      - 0.375
    - - -0.14
      - 0.375
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.4
  free_goal_vel: false
  complete_global_plan: true
  min_obstacle_dist: 0.12
  inflation_dist: 0.22
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 0.2
  obstacle_poses_affected: 6
  weight_max_vel_x: 2.0
  weight_max_vel_theta: 1.0
  weight_acc_lim_x: 0.2
  weight_acc_lim_theta: 1.0
  weight_kinematics_nh: 1000.0
  weight_kinematics_forward_drive: 8.0
  weight_kinematics_turning_radius: 50.0
  weight_obstacle: 6.0
  weight_inflation: 0.02
  weight_optimaltime: 5.0
  weight_shortest_path: 0.3
  enable_homotopy_class_planning: true
  enable_multithreading: true
  max_number_classes: 4
  selection_cost_hysteresis: 1.0
  selection_prefer_initial_plan: 0.4
  roadmap_graph_no_samples: 20
  roadmap_graph_area_width: 6.5
  h_signature_prescaler: 0.5
  h_signature_threshold: 0.1
  visualize_hc_graph: false
  publish_feedback: true
