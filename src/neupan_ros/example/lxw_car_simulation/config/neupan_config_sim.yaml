# mpc
receding: 30
step_time: 0.1
ref_speed: 0.5
device: 'cpu'
time_print: False
collision_threshold: 0.001

# robot
robot:
  kinematics: 'acker'
  wheelbase: 0.67
  max_speed: [0.5, 0.35]
  max_acce: [0.8, 0.20]
  length: 0.95
  width: 0.75

# initial path
ipath:
  interval: 0.09
  waypoints: []
  curve_style: 'reeds'
  min_radius: 1.85
  loop: False
  arrive_threshold: 0.5
  close_threshold: 0.30
  arrive_index_threshold: 2
  ind_range: 80

# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint: None
  iter_threshold: 0.1

# adjust parameters
adjust:
  q_s: 1.2
  p_u: 21.0
  eta: 0.5
  d_max: 0.5
  d_min: 0.2
