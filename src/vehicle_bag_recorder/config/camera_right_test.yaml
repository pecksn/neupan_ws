  - /hybridnets/debug_image
  - /hybridnets/valid
  - /hybridnets/inference_hz
  - /hybridnets/network_age_ms
  - /hybridnets/frame_seq
  - /hybridnets/confidence
  - /hybridnets/left_boundary_valid
  - /hybridnets/right_boundary_valid
  - /hybridnets/intersection
