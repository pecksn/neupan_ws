# 修改这个文件即可增删录制话题。不存在的话题不会阻止其他话题录制，
# 因此可提前把尚未接入的传感器写在 topics 中。
output_directory: /home/nuc/lxw/neupan_ws/rosbags
bag_prefix: vehicle_data
timezone_offset_hours: 8.0  # 文件名和 JSON 清单使用北京时间 UTC+8
session_subdirectory: true  # 每次录制保存到 rosbagYYYYMMDD_HHMMSS 子目录

# 单个 bag 达到该大小后自动分包，单位 MB；0 表示不分包。
split_size_mb: 2048
compression: lz4          # 可选：none、bz2、lz4
buffer_size_mb: 1024
chunk_size_kb: 768
tcp_nodelay: true

# 剩余空间低于此值时安全停止录制，避免写满系统盘；0 表示关闭保护。
min_free_space_gb: 8.0
disk_check_period_sec: 5.0

# 这些话题必须在录制期间实际出现。缺失时录包仍继续，但终端会周期告警。
# /cloud_registered_body 是路缘检测离线复现的核心点云；
# /camera/image_raw 和 /camera/camera_info 用于回放后向 HybridNets 提供彩色图像及标定信息。
required_topics:
  - /cloud_registered_body
  - /tf
  - /gps/fix
  - /gnss/gpgga
  - /heading
  - /camera/image_raw
  - /camera/camera_info

topics:
  # MID360 原始数据和 FAST-LIO 输出（路缘离线测试必须保留 cloud_registered_body）
  - /livox/lidar
  - /livox/imu
  - /cloud_registered_body
  - /cloud_registered
  - /Odometry

  # 定位与 TF
  - /tf
  - /tf_static
  - /odom
  - /odometry/local
  - /odometry/global
  - /odometry/gps
  - /gps/fix
  - /gps/vel
  - /heading
  - /heading_deg
  - /gps/nmea_sentence
  - /gnss/gpgga
  - /lio_guard/status
  - /gnss/solution_status
  - /gnss/serial_diagnostics
  - /gnss/time_diagnostics
  - /gps_guard/status
  - /localization_safe

  # 规划、环境感知和控制（按实际用途增删）
  - /scan
  - /osm_global_path
  - /osm_global_path_ll
  - /osm_global_path_curb_refined
  - /move_base_simple/goal
  - /gps_goal_ll
  - /goal_arrived
  - /neupan_goal
  - /road_curb/right_edge
  - /road_curb/lateral_error
  - /road_curb/status
  - /road_curb/roi_cloud
  - /road_curb/candidate_cloud
  - /cmd_vel/auto
  - /cmd_vel_remote
  - /cmd_vel/remote
  - /cmd_vel/selected
  - /vehicle/control_mode/status
  - /vehicle/control_mode
  - /vehicle/command_audit
  - /neupan/runtime
  - /neupan/failure
  - /neupan/camera_path_guard
  - /neupan/route_connection
  - /neupan_initial_path
  - /neupan_ref_state
  - /neupan_plan
  - /neupan/scan_health
  - /odometry/lio_guarded
  - /gps_guard/local_fault_event
  - /motor/status
  - /motor/alarm
  - /neupan/resources
  - /neupan/config_snapshot
  - /global_path_tracker/status

  # USB Camera3 输出。录制旋转 180° 后的原始彩色 Image，可在 rosbag
  # 回放时由 cv_bridge 直接转成 OpenCV RGB/BGR 图像供 HybridNets 推理。
  # 不录 /camera/image_raw_unrotated，避免重复占用空间和图像方向错误。
  - /camera/image_raw
  - /camera/camera_info

# 高级用法：record_all=true 等价于 rosbag record -a，通常不建议长期使用。
record_all: false
# exclude_regex 仅在 record_all=true 时使用，例如排除超大的调试图像：
exclude_regex: ""
