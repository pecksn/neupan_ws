output_directory: /home/nuc/lxw/neupan_ws/rosbags
bag_prefix: hybridnets_vehicle_data
timezone_offset_hours: 8.0
# 每次录制新建 rosbagYYYYMMDD_HHMMSS 子目录，与 vehicle_data.yaml 一致。
session_subdirectory: true

# 单个 bag 达到 2048 MB 后自动分包；分包仍保存在同一次录制的子目录中。
split_size_mb: 2048
compression: lz4
buffer_size_mb: 1024
chunk_size_kb: 768
tcp_nodelay: true
min_free_space_gb: 8.0
disk_check_period_sec: 5.0

required_topics:
  - /livox/lidar
  - /cloud_registered_body
  - /camera/remote_image_raw  # GPU 板发送、NUC 解码后的实时彩色画面
  - /camera/remote_camera_info
  - /hybridnets/result_json
  - /hybridnets/debug_image
  - /hybridnets/valid
  - /tf

topics:
  - /livox/lidar
  - /livox/imu
  - /cloud_registered_body
  - /cloud_registered
  - /Odometry
  - /tf
  - /tf_static
  - /camera/remote_image_raw
  - /camera/remote_camera_info
  - /hybridnets/result_json
  - /hybridnets/debug_image
  - /hybridnets/valid
  - /hybridnets/inference_hz
  - /hybridnets/network_age_ms
  - /hybridnets/frame_seq
  - /hybridnets/confidence
  - /hybridnets/left_boundary_valid
  - /hybridnets/right_boundary_valid
  - /hybridnets/intersection
  - /hybridnets/capture_header
  - /odom
  - /gps/fix
  - /heading
  - /osm_global_path
  - /osm_global_path_curb_refined
  - /road_curb/status
  - /cmd_vel/selected
  - /cmd_vel/auto
  - /vehicle/control_mode/status
  - /neupan/runtime
  - /neupan/scan_health
  - /gps_guard/status
  - /lio_guard/status
  - /localization_safe
  - /odometry/local
  - /odometry/global
  - /odometry/gps
  - /gnss/gpgga
  - /odometry/lio_guarded
  - /gps_guard/local_fault_event
  - /motor/status
  - /motor/alarm
  - /neupan/resources
  - /neupan/config_snapshot

# 同时录原视频和叠加图会增加写盘量；分包和磁盘剩余空间保护仍然生效。
record_all: false
exclude_regex: ""
